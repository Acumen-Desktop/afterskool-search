<!-- The desert behind everything: 4x4's sandstone scene (4x4-tao surfaces/opening/scene), the same picture at every
     size, with a tiny soft copy inline so the first frame is already the place, not a blank -->
<desert-scene>
  <picture>
    <source media="(max-aspect-ratio: 2/3)" type="image/avif" sizes="100vw"
      srcset="scene/portrait-720.avif 720w, scene/portrait-1080.avif 1080w">
    <source media="(max-aspect-ratio: 2/3)" type="image/webp" srcset="scene/portrait-1080.webp 1080w" sizes="100vw">
    <source type="image/avif" sizes="100vw"
      srcset="scene/sandstone-1280.avif 1280w, scene/sandstone-1920.avif 1920w, scene/sandstone-2560.avif 2560w, scene/sandstone-3840.avif 3840w">
    <img src="scene/sandstone-1920.webp" alt="" fetchpriority="high">
  </picture>
</desert-scene>

<!-- Memories: drawings from the videos drifting across the sky on the wind (arrival.js). Behind the page, not in it -->
